<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- boostrap CDN -->
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- fontawesom CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <!-- css file -->
    <link rel="stylesheet" href="./css/index.css">
    <title>Smart City | Login</title>
</head>

<body>
    <!-- header -->
    <div class="row mb-1">
        <div class="col-12 p-0">
            <nav class="navbar  navbar-expand-lg bg-primary navrbar-dark">
                <div class="container-fluid py-0">
                    <!-- brand name -->
                    <a class="navbar-brand fw-bold text-light py-0 mb-0" href="./index.html">
                        <!-- Logo -->
                        <img src="./img/Smartcity logo1.png" class="img-fluid p-1"
                            style="width: 50px; height: 50px; padding: 0px;" alt="logo">Smart
                        <span style="color: green;">city</span>
                    </a>

                    <!-- toggle Button -->
                    <button class="navbar-toggler px-1" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">

                        <!-- Menu's -->
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active text-light" aria-current="page" href="./index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="#">About</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link text-light" href="#">Services</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="#">Track Complaint</a>
                            </li>
                        </ul>

                        <!-- login register button -->
                        <form action="">
                            <button class="btn  btn-outline-light fs-6 py-0 px-2" type="submit"
                                    id="btnlogin"><a href="./login.html">Login</a></button></a>
                            <button class="btn btn-outline-light fs-6 py-0 px-2" type="submit">Register</button>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <!-- login form code -->
    <div class="container p-5 border-black">
        <h1 class="text-center pb-5">Login Form</h1>
        <form>
            <div class="row mb-3">
                <label for="inputEmail3" class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="inputEmail3" autocomplete="off">
                </div>
            </div>
            <div class="row mb-3">
                <label for="inputPassword3" class="col-sm-2 col-form-label">Password</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="inputPassword3" autocomplete="off">
                </div>
            </div>
            <div class="row mb-3">
                <label for="inputaddress" class="col-sm-2 col-form-label">Address</label>
                <div class="col-sm-10">
                    <textarea name="" id=""></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
    </div>


    <!-- Bootstrap JS -->
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
